<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Vanilla JavaScript API Search Application featuring debounce, AbortController cancellation, caching, pagination, and UI states." />
  <title>API Search Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles/style.css" />
</head>
<body>

  <header class="app-header">
    <div class="container header-inner">
      <div class="brand">
        <h1 class="brand-title">Product Search</h1>
      </div>
    </div>
  </header>

  <main class="container main-content">

    <section class="controls-section card-box" aria-label="Search Controls">
      <form id="search-form" class="search-form" onsubmit="event.preventDefault();">
        <div class="search-input-wrap">
          <div class="search-field-box">
            <input
              type="search"
              id="search-input"
              class="search-input"
              placeholder="Search products, brands, or categories..."
              autocomplete="off"
              aria-label="Search products"
            />
            <button type="button" id="clear-search-btn" class="clear-btn hidden" aria-label="Clear Search" title="Clear Search">
              ✕
            </button>
          </div>
          <button type="submit" id="search-submit-btn" class="btn btn-primary search-btn">
            Search
          </button>
        </div>

        <div class="filters-wrap">
          <div class="form-group">
            <label for="category-select">Category</label>
            <select id="category-select" class="select-input" aria-label="Filter by Category">
              <option value="all">All Categories</option>
            </select>
          </div>

          <div class="form-group">
            <label for="sort-select">Sort By</label>
            <select id="sort-select" class="select-input" aria-label="Sort Results">
              <option value="default">Relevance / Default</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating-desc">Highest Rated</option>
              <option value="title-asc">Title: A-Z</option>
            </select>
          </div>

          <div class="form-group">
            <label for="limit-select">Per Page</label>
            <select id="limit-select" class="select-input" aria-label="Items per page">
              <option value="12">12 Items</option>
              <option value="24">24 Items</option>
              <option value="36">36 Items</option>
            </select>
          </div>
        </div>
      </form>

      <div id="recent-container" class="recent-container"></div>
    </section>

    <div id="status-container" class="status-container" aria-live="polite"></div>

    <section id="results-container" class="results-container" aria-live="polite"></section>

    <div id="pagination-container" class="pagination-container"></div>

  </main>

  <div id="detail-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button id="close-modal-btn" class="modal-close-btn" aria-label="Close modal">✕</button>
      <div id="modal-content" class="modal-body"></div>
    </div>
  </div>

  <footer class="app-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 Product Search App</p>
    </div>
  </footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
